name: "llama-engine"

services:
  llama-runtime:
    build:
      context: ./llama-runtime
      dockerfile: Dockerfile
    container_name: llama-runtime
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${LLAMA_GPU_DEVICE:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Flags de llama-server (se componen en el entrypoint)
      - LLAMA_MODEL=${LLAMA_MODEL:-qwen3.5-4b}
      - LLAMA_MMPROJ=${LLAMA_MMPROJ:-auto}
      - LLAMA_NGPU=${LLAMA_NGPU:--1}
      - LLAMA_CTX_SIZE=${LLAMA_CTX_SIZE:-32768}
      - LLAMA_FLASH_ATTN=${LLAMA_FLASH_ATTN:-1}
      - LLAMA_CHAT_TEMPLATE=${LLAMA_CHAT_TEMPLATE:-auto}
      # Optimización (2026-09-17)
      - LLAMA_CACHE_TYPE_K=${LLAMA_CACHE_TYPE_K:-}
      - LLAMA_CACHE_TYPE_V=${LLAMA_CACHE_TYPE_V:-}
      - LLAMA_PARALLEL=${LLAMA_PARALLEL:-}
      - LLAMA_THREADS=${LLAMA_THREADS:-}
      - LLAMA_THREADS_BATCH=${LLAMA_THREADS_BATCH:-}
    ports:
      - "127.0.0.1:${LLAMA_HOST_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
      - ./llama-runtime/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - engine-network
    restart: unless-stopped

  engine-api:
    build:
      context: ./engine-api
      dockerfile: Dockerfile
    container_name: engine-api
    environment:
      - PORT=${ENGINE_API_PORT:-3050}
      - API_KEY=${ENGINE_API_KEY:-llama-engine-dev}
      - LLAMA_RUNTIME_URL=http://llama-runtime:8080
      - LLAMA_RUNTIME_CONTAINER=llama-runtime
      - MODELS_DIR=/models
      - OLLAMA_GENERIC=false
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=10000
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_URL=${HF_HUB_URL:-https://huggingface.co}
      - TRAINER_URL=http://llama-trainer:8081
    volumes:
      - ./models:/models:rw
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${ENGINE_API_PORT:-3050}:3050"
    networks:
      - engine-network
    depends_on:
      - llama-runtime
      - llama-trainer
    restart: unless-stopped

  engine-ui-telemetry:
    build:
      context: ./engine-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3050}
        - VITE_API_KEY=${ENGINE_API_KEY:-llama-engine-dev}
    container_name: engine-ui-telemetry
    ports:
      - "${ENGINE_UI_PORT:-3051}:80"
    networks:
      - engine-network
    depends_on:
      - engine-api
    restart: unless-stopped

  engine-agent:
    build:
      context: ./engine-agent
      dockerfile: Dockerfile
    container_name: engine-agent
    environment:
      - AGENT_PORT=3060
      - ENGINE_API_URL=http://engine-api:3050
      - ENGINE_API_KEY=${ENGINE_API_KEY:-llama-engine-dev}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - DB_PATH=/data/agent.db
    volumes:
      - agent-data:/data
    ports:
      - "127.0.0.1:${AGENT_PORT:-3060}:3060"
    networks:
      - engine-network
    depends_on:
      - engine-api
    restart: unless-stopped

  engine-ui-agent:
    build:
      context: ./engine-ui-agent
      dockerfile: Dockerfile
      args:
        - VITE_AGENT_URL=http://localhost:3060
        - VITE_AGENT_KEY=${ENGINE_API_KEY:-llama-engine-dev}
    container_name: engine-ui-agent
    ports:
      - "${AGENT_UI_PORT:-3061}:80"
    networks:
      - engine-network
    depends_on:
      - engine-agent
    restart: unless-stopped

  llama-trainer:
    build:
      context: ./llama-trainer
      dockerfile: Dockerfile
    container_name: llama-trainer
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${LLAMA_GPU_DEVICE:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TRAINER_PORT=${TRAINER_PORT:-8081}
      - DATA_DIR=/data
      - MODELS_DIR=/models
    volumes:
      - ./data/datasets:/data/datasets
      - ./data/base:/data/base
      - ./data/output:/data/output
      - ./models:/models:rw
    ports:
      - "127.0.0.1:${TRAINER_PORT:-8081}:8081"
    networks:
      - engine-network
    restart: unless-stopped

networks:
  engine-network:
    driver: bridge

volumes:
  agent-data: